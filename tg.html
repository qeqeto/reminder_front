<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ახალი დავალება</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--ink:var(--tg-theme-text-color,#14212b);--mut:var(--tg-theme-hint-color,#6b7a86);--card:var(--tg-theme-secondary-bg-color,#f1f4f6);--acc:var(--tg-theme-button-color,#0e7490);--acc-ink:var(--tg-theme-button-text-color,#fff);--bad:#d13b32}
*{box-sizing:border-box}
body{margin:0;padding:16px 16px 32px;font:16px/1.5 system-ui,"Noto Sans Georgian",sans-serif;background:var(--bg);color:var(--ink)}
h1{font-size:20px;margin:0 0 14px}label.t{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input[type=text],input[type=datetime-local]{width:100%;min-height:46px;padding:10px 12px;border:1px solid transparent;border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:380px){.grid{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:10px;background:var(--card);cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--acc);margin:0}
button{width:100%;min-height:50px;margin-top:20px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font:600 16px inherit;font-family:inherit;cursor:pointer}
button:disabled{opacity:.5}.msg{margin-top:12px;min-height:22px;color:var(--bad);font-size:14px}.hint{font-size:13px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<h1>ახალი დავალება</h1>
<form id="f" hidden>
  <label class="t" for="title">დოკუმენტის სახელი</label>
  <input id="title" type="text" required autocomplete="off">
  <label class="t" for="dl">ბოლო ვადა (თარიღი და დრო)</label>
  <input id="dl" type="datetime-local" required>
  <p class="hint">ნაგულისხმევი: ახლიდან 10 დღე</p>
  <label class="t">შეხსენების დრო</label>
  <div class="grid" id="rem"></div>
  <label class="t">ვის დაევალოს</label>
  <div class="grid" id="ppl"></div>
  <label class="opt" style="margin-top:14px"><input type="checkbox" id="notify">შექმნისთანავე გაუგზავნე შეტყობინება</label>
  <button id="go">დავალების შექმნა</button>
</form>
<p class="msg" id="msg" role="alert"></p>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const initData=tg?tg.initData:'',BASE=(window.API_URL||'').replace(/\/+$/,''),$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REM=[[10080,'7 დღით ადრე'],[4320,'3 დღით ადრე'],[1440,'1 დღით ადრე'],[120,'2 საათით ადრე'],[60,'1 საათით ადრე'],[0,'ვადის დადგომისას']],DEF=[4320,1440,60,0];
const pad=n=>String(n).padStart(2,'0'),toInput=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
async function call(p,b){let r;try{r=await fetch(BASE+'/api/tg/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,...b})})}catch{throw new Error('სერვერთან კავშირი ვერ მოხერხდა')}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'შეცდომა');return j}
(async()=>{
  if(!initData){$('#msg').textContent='გახსენი ეს ფორმა Telegram ბოტიდან: დაწერე /new';return}
  try{
    const d=await call('form',{});
    $('#dl').value=toInput(new Date(Date.now()+10*864e5));
    $('#rem').innerHTML=REM.map(([n,t])=>`<label class="opt"><input type="checkbox" name="rd" value="${n}" ${DEF.includes(n)?'checked':''}>${t}</label>`).join('');
    $('#ppl').innerHTML=d.users.map(u=>`<label class="opt"><input type="checkbox" name="u" value="${u.id}" ${u.id===d.me.id?'checked':''}>${esc(u.name)}</label>`).join('');
    $('#f').hidden=false;
  }catch(e){$('#msg').textContent=e.message}
})();
$('#f').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('#go');b.disabled=true;$('#msg').textContent='';
  try{
    const r=await call('documents',{title:$('#title').value,deadline:new Date($('#dl').value).toISOString(),
      remind_mins:[...document.querySelectorAll('[name=rd]:checked')].map(x=>+x.value),
      user_ids:[...document.querySelectorAll('[name=u]:checked')].map(x=>+x.value),notify:$('#notify').checked});
    if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');
    $('#f').hidden=true;const ok=(r.results||[]).filter(x=>x.ok).length;
    $('#msg').style.color='var(--ink)';$('#msg').textContent='დავალება შეიქმნა ✅'+(r.results?` (გაიგზავნა: ${ok})`:'');
    setTimeout(()=>tg&&tg.close(),1200);
  }catch(err){$('#msg').textContent=err.message;b.disabled=false}
});
</script>
</body>
</html>
